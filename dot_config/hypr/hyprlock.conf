source = ~/.config/hypr/colours.conf

general {
  hide_cursor = false
  ignore_empty_input = false
  fail_timeout = 1000 # Milliseconds until the ui resets after a failed auth attempt (default: 2000)
}

background {
  monitor =
  # blur_passes = 1
  reload_time = 0 # reload with SIGUSR2
  reload_cmd = awww query -j | jq -r '.[][0].displaying.image'
  crossfade_time = 8.0 # time in seconds
}

input-field {
  monitor =
  size = 240, 40
  outline_thickness = 3
  inner_color = rgb($base_hex)
  outer_color = rgb($lavender_hex)
  font_color = rgb($text_hex)
  fail_color = rgb($red_hex)
  # dots_text_format = 
  capslock_color = rgb($red_hex)
  numlock_color = rgb($yellow_hex)
  bothlock_color = rgb($red_hex) rgb($yellow_hex) 15deg
  invert_numlock = true

  shadow_passes = 1
  shadow_color = rgb($base_hex)
  position = 0, -50

}

# time
label {
  text = $TIME
  halign = center
  font_size = 96
  color = rgb($lavender_hex)
  position = 0, 100

  shadow_passes = 2
  shadow_size = 3
  shadow_color = rgb($base_hex)
  shadow_boost = 1
}
# date
label {
  # update command every 1000ms
  text = cmd[update:1000] echo "$(date '+%a, %d %b %y')"
  halign = center
  font_size = 16
  color = rgb($lavender_hex)
  position = 0, 0

  shadow_passes = 2
  shadow_size = 3
  shadow_color = rgb($base_hex)
  shadow_boost = 1
}

# caps lock warning
label {
  monitor =
  text = cmd[update:200] awk '{print ($0?"Caps Lock on":""); exit}' /sys/class/leds/input*::capslock/brightness
  color = rgb($text_hex)
  font_size = 12
  position = 0, -50
  shadow_passes = 1
  shadow_size = 2
  shadow_color = rgb($base_hex)
  shadow_boost = 2
  halign = center
  # valign = center
}
